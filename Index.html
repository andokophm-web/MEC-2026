<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MEC Fit Tracker 2026</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E30613">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MEC Fit Tracker">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F4F5F7; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #F4F5F7; z-index: 5;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    #loader .spin {
      width: 40px; height: 40px; border: 4px solid #eee; border-top-color: #E30613;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px;
    }
    #loader p { color: #7A7F8A; font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spin"></div>
    <p>Memuat MEC Fit Tracker...</p>
  </div>

  <!--
    GANTI URL DI BAWAH INI dengan Web App URL Apps Script Anda
    (harus diakhiri /exec)
  -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/GANTI_DENGAN_ID_DEPLOYMENT_ANDA/exec"
    onload="document.getElementById('loader').style.display='none'"
    allow="clipboard-write"
  ></iframe>

  <script>
    // Registrasi service worker agar PWA bisa di-"Add to Home Screen" dengan baik
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
